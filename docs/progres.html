        // Interactive Sound Synthesizer via Web Audio API (No external sound dependencies)
        let soundEnabled = true;
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (!soundEnabled) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                if (type === 'click') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.08);
                    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.08);
                } else if (type === 'slide') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(250, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + 0.15);
                    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.15);
                } else if (type === 'success') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
                    osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.08); // E5
                    osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.16); // G5
                    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.3);
                }
            } catch(e) { console.log("Sound error context:", e); }
        }

                btn.classList.remove('bg-gray-300');

            } else {
                btn.innerHTML = '🔇 SOUND: OFF';

                renderSlide();
            } else {
                docBtn.className = 'bg-brutalYellow brutal-border px-4 py-2 font-black uppercase text-xs tracking-wider brutal-shadow-sm hover:translate-x-[-1px] hover:translate-y-[-1px] transition-transform brutal-btn-active';
                slideBtn.className = 'bg-white brutal-border px-4 py-2 font-black uppercase text-xs tracking-wider brutal-shadow-sm hover:translate-x-[-1px] hover:translate-y-[-1px] transition-transform brutal-btn-active';
                sidebar.classList.add('hidden');
                document.getElementById('content-area').className = 'lg:col-span-4 flex flex-col gap-6';
                renderAllDocuments();
            }
        }

        // Generate Sidebar Navigation List
        function buildSidebarMenu() {
            const menu = document.getElementById('slides-menu-list');
            menu.innerHTML = '';
            slides.forEach((slide, idx) => {
                const btn = document.createElement('button');
                btn.id = `menu-item-${idx}`;
                btn.className = `w-full text-left p-2 border-2 border-brutalDark brutal-shadow-sm text-xs font-black uppercase tracking-wide transition-all ${idx === currentSlide ? 'bg-brutalYellow' : 'bg-white'}`;
                btn.innerText = slide.short;
                btn.onclick = () => {
                    goToSlide(idx);
                };
                menu.appendChild(btn);
            });
        }

        // Load specific slide
        function goToSlide(idx) {
            if (idx < 0 || idx >= slides.length) return;
            playSound('slide');
            currentSlide = idx;
            
            // Update active sidebar style
            slides.forEach((_, i) => {
                const item = document.getElementById(`menu-item-${i}`);
                if (item) {
                    if (i === currentSlide) {
                        item.classList.add('bg-brutalYellow');
                        item.classList.remove('bg-white');
                    } else {
                        item.classList.remove('bg-brutalYellow');
                        item.classList.add('bg-white');
                    }
                }
            });
            renderSlide();
        }

        // Render current slide in Slide Mode
        function renderSlide() {
            const area = document.getElementById('content-area');
            const data = slides[currentSlide];
            
            area.innerHTML = `
                <div class="slide-enter">
                    ${data.html}
                </div>
                <!-- Mini controls for navigation inside slides -->
                <div class="flex justify-between items-center bg-brutalBg brutal-border p-4 brutal-shadow">
                    <button onclick="goToSlide(currentSlide - 1)" class="bg-white hover:bg-brutalYellow border-2 border-brutalDark p-2 font-bold text-xs uppercase brutal-shadow-sm brutal-btn-active ${currentSlide === 0 ? 'opacity-50 pointer-events-none' : ''}">
                        &larr; Slide Sebelumnya
                    </button>
                    <span class="font-mono text-xs font-black">SLIDE ${currentSlide + 1} / ${slides.length}</span>
                    <button onclick="goToSlide(currentSlide + 1)" class="bg-white hover:bg-brutalYellow border-2 border-brutalDark p-2 font-bold text-xs uppercase brutal-shadow-sm brutal-btn-active ${currentSlide === slides.length - 1 ? 'opacity-50 pointer-events-none' : ''}">
                        Slide Berikutnya &rarr;
                    </button>
                </div>
            `;
            
            // Post render initialization based on current slide
            initSlideSpecialInteractions();
        }

        // Render all slides as standard long document for print or review
        function renderAllDocuments() {
            const area = document.getElementById('content-area');
            area.innerHTML = '';
            
            slides.forEach((data, index) => {
                const wrapper = document.createElement('div');
                wrapper.className = 'mb-6';
                wrapper.innerHTML = `
                    <div class="relative">
                        <div class="absolute right-4 top-4 bg-brutalDark text-white font-mono px-2 py-0.5 text-xs z-10">PAGE ${index + 1}</div>
                        ${data.html}
                    </div>
                `;
                area.appendChild(wrapper);
            });
            
            // Init all special scripts so they work in scroll mode too
            initSlideSpecialInteractions();
        }

        // Trigger individual custom functions depending on what slide/page is active
        function initSlideSpecialInteractions() {
            renderGitGraph();
            showTeam('rouf');
            filterChecklist('all');
            calculateProgress();
        }

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (viewMode === 'slide') {
                if (e.key === 'ArrowRight' || e.key === ' ') {
                    e.preventDefault();
                    goToSlide(currentSlide + 1);
                } else if (e.key === 'ArrowLeft') {
                    e.preventDefault();
                    goToSlide(currentSlide - 1);
                }
            }
        });
    </script>

    <script>
        // Git Graph Visual Simulator
        function stepGit(direction) {
            playSound('click');
            currentGitStep = Math.max(0, Math.min(gitTimeline.length - 1, currentGitStep + direction));
            renderGitGraph();
        }

        function resetGit() {
            playSound('click');
            currentGitStep = 0;
            renderGitGraph();
        }

        function renderGitGraph() {
            const wrapper = document.getElementById('git-graph-container');
            const msg = document.getElementById('git-status-message');
            if (!wrapper) return; // Guard for viewMode changes
            
            wrapper.innerHTML = '';
            
            // Current list of active branches to display columns
            const branches = ['main', 'staging', 'dev', 'feature/inventory', 'feature/multi-cabang'];
            const colors = {
                'main': '#FF6B35',              // Orange
                'staging': '#FF7EE2',           // Pink
                'dev': '#3FE5FF',               // Cyan
                'feature/inventory': '#FFE600',  // Yellow
                'feature/multi-cabang': '#39e38e' // Green
            };

            // Render Header Columns
            let colHeader = document.createElement('div');
            colHeader.className = 'grid grid-cols-12 gap-2 border-b border-gray-800 pb-2 mb-2 text-[10px] font-bold text-gray-400';
            colHeader.innerHTML = `
                <div class="col-span-1">Tipe</div>
                <div class="col-span-6 flex gap-4">
                    ${branches.map(b => `<span style="color: ${colors[b]}">${b.toUpperCase()}</span>`).join('')}
                </div>
                <div class="col-span-5">Deskripsi Commit / Aksi</div>
            `;
            wrapper.appendChild(colHeader);

            // Render Commit Steps Up To currentGitStep
            for (let i = 0; i <= currentGitStep; i++) {
                const step = gitTimeline[i];
                const row = document.createElement('div');
                row.className = `grid grid-cols-12 gap-2 items-center py-1 border-b border-[#222] ${i === currentGitStep ? 'bg-[#222] text-white font-bold' : 'text-gray-400'}`;
                
                // Column 1: Action Type Badge
                let badgeColor = "bg-gray-600";
                if (step.action === "checkout") badgeColor = "bg-blue-600";
                if (step.action === "merge") badgeColor = "bg-red-600";
                if (step.action === "commit") badgeColor = "bg-green-600";
                
                let badge = `<span class="px-1.5 py-0.5 rounded text-[8px] text-white ${badgeColor}">${step.action.toUpperCase()}</span>`;
                
                // Column 2: Visual Branch Dots & Lines
                let visual = `<div class="flex gap-4 items-center pl-1 font-mono">`;
                branches.forEach(b => {
                    const isTargetBranch = (step.branch === b) || (step.action === 'merge' && (step.from === b || step.to === b));
                    if (isTargetBranch) {
                        visual += `<span class="h-3 w-3 rounded-full border border-white inline-block" style="background-color: ${colors[b]}"></span>`;
                    } else {
                        visual += `<span class="h-3 w-3 inline-block text-gray-800">|</span>`;
                    }
                });
                visual += `</div>`;
                
                // Column 3: Commit Message
                let desc = `<span class="truncate">${step.msg}</span>`;
                
                row.innerHTML = `
                    <div class="col-span-1">${badge}</div>
                    <div class="col-span-6">${visual}</div>
                    <div class="col-span-5 text-[10px]">${desc}</div>
                `;
                wrapper.appendChild(row);
            }
            
            // Auto scroll container to bottom
            wrapper.scrollTop = wrapper.scrollHeight;
            
            // Update explanatory text
            if (msg) {
                const currentAct = gitTimeline[currentGitStep];
                msg.innerHTML = `Langkah ${currentGitStep + 1} dari ${gitTimeline.length}: <b>[${currentAct.action.toUpperCase()}]</b> ${currentAct.msg}`;
            }
        }
    </script>

            const itemsHtml = data.contributions.map(item => `
                <li class="flex items-start gap-2 border-b border-gray-100 pb-2">
                    <span class="text-brutalOrange font-black">&bull;</span>
                    <span class="text-sm text-gray-800 font-semibold">${item}</span>
                </li>
            `).join('');

            display.innerHTML = `
                <div class="grid grid-cols-1 md:grid-cols-12 gap-4 items-start slide-enter">
                    <div class="md:col-span-4 p-4 brutal-border ${data.color} brutal-shadow-sm flex flex-col justify-between">
                        <div>
                            <span class="text-[10px] uppercase font-mono tracking-widest bg-brutalDark text-white px-2 py-0.5">TEAM MEMBER</span>
                            <h4 class="font-display font-black text-2xl mt-2 leading-none">${data.name}</h4>
                            <p class="text-xs uppercase font-bold text-gray-700 mt-1">${data.role}</p>
                        </div>
                        <div class="mt-6 font-mono text-[10px] border-t border-black/20 pt-2">
                            <span>MEMBER ID: #0${Object.keys(teamData).indexOf(memberKey)+1}</span>
                        </div>
                    </div>
                    
                    <div class="md:col-span-8">
                        <h5 class="font-display font-black text-sm uppercase tracking-wide text-gray-400 mb-3">Kontribusi Teknis Utama:</h5>
                        <ul class="space-y-3">
                            ${itemsHtml}
                        </ul>
                    </div>
                </div>
            `;
        }
    </script>

    <script>
        // Interactive Checklist Filter & Logic Builder
        let activeChecklistFilter = 'all';

        function filterChecklist(filter) {
            playSound('click');
            activeChecklistFilter = filter;
            
            // Update filter buttons style
            document.querySelectorAll('.chk-filter').forEach(btn => {
                btn.className = "chk-filter bg-white text-brutalDark px-3 py-1 font-bold text-xs border border-black";
            });
            const activeBtn = document.getElementById(`chk-btn-${filter}`);
            if (activeBtn) {
                activeBtn.className = "chk-filter bg-brutalDark text-white px-3 py-1 font-bold text-xs border border-black";
            }
            
            renderChecklist();
        }

        function toggleChecklistTask(id) {
            const task = checklistItems.find(t => t.id === id);
            if (task) {
                task.completed = !task.completed;
                if (task.completed) {
                    playSound('success');
                } else {
                    playSound('slide');
                }
                calculateProgress();
                renderChecklist();
            }
        }

        function calculateProgress() {
            const total = checklistItems.length;
            const completed = checklistItems.filter(t => t.completed).length;
            const percent = Math.round((completed / total) * 100);
            
            const badge = document.getElementById('progress-percent');
            if (badge) {
                badge.innerText = `${percent}%`;
                // Soft animation highlight
                badge.classList.add('animate-bounce');
                setTimeout(() => badge.classList.remove('animate-bounce'), 1000);
            }
        }

        function renderChecklist() {
            const container = document.getElementById('interactive-checklist-box');
            if (!container) return; // Guard for viewMode changes
            
            container.innerHTML = '';
            
            const filtered = checklistItems.filter(task => {
                if (activeChecklistFilter === 'all') return true;
                return task.phase === parseInt(activeChecklistFilter);
            });
            
            if (filtered.length === 0) {
                container.innerHTML = `<p class="text-center text-gray-500 py-6">Tidak ada tugas pada fase ini.</p>`;
                return;
            }
            
            // Sort to keep unfinished ones at bottom or grouped nicely
            filtered.forEach(task => {
                const el = document.createElement('div');
                el.className = `flex items-start gap-3 p-2 border border-gray-200 transition-colors ${task.completed ? 'bg-gray-50/50' : 'bg-[#FFFDF6] border-l-4 border-l-brutalOrange'}`;
                
                const checkedAttr = task.completed ? 'checked' : '';
                const titleStyle = task.completed ? 'line-through text-gray-400' : 'text-brutalDark font-semibold';
                const phaseLabels = ['Zero', 'Fase 1: Inisiasi', 'Fase 2: Core Dev', 'Fase 3: Integrasi', 'Fase 4: Final Release'];
                
                el.innerHTML = `
                    <input type="checkbox" ${checkedAttr} onclick="toggleChecklistTask('${task.id}')" class="mt-1 h-4 w-4 brutal-border-sm accent-brutalOrange cursor-pointer">
                    <div class="flex-grow">
                        <div class="flex flex-wrap items-center gap-1.5 mb-1">
                            <span class="bg-gray-100 text-[9px] font-bold px-1.5 py-0.5 uppercase tracking-tight">${phaseLabels[task.phase]}</span>
                            <span class="bg-brutalCyan/20 text-[9px] font-bold px-1.5 py-0.5 uppercase tracking-tight text-blue-700">${task.assignee}</span>
                            ${task.comment ? `<span class="bg-brutalOrange/20 text-[9px] font-bold px-1.5 py-0.5 text-brutalOrange">${task.comment}</span>` : ''}
                        </div>
                        <p class="${titleStyle} leading-tight">${task.desc}</p>
                    </div>
                `;
                container.appendChild(el);
            });
        }
    </script>

    <script>
        // Start presentation on load
        window.onload = function() {
            buildSidebarMenu();
            renderSlide();
            calculateProgress();
        };
    </script>

</body>
</html>
